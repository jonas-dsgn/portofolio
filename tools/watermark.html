<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Private client-side watermark tool for Jonas Nettel photography.">
  <title>WATERMARK TOOL | Jonas Nettel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./watermark.css">
</head>
<body>
  <main class="watermark-tool">
    <header class="tool-header">
      <div>
        <p class="tool-kicker">JONAS NETTEL / PRIVATE TOOL</p>
        <h1>Watermark Studio</h1>
      </div>
      <img class="tool-mark" src="../assets/logos/jonasnettel_small.svg" alt="Jonas Nettel mark">
    </header>

    <section class="tool-layout" aria-label="Watermark editor">
      <aside class="control-panel">
        <div class="upload-block">
          <label class="upload-button" for="photoInput">Add photos</label>
          <input id="photoInput" type="file" accept="image/*" multiple>
          <button class="secondary-button replace-button" id="replacePhoto" type="button" disabled>Replace selected</button>
          <input id="replaceInput" type="file" accept="image/*">
          <p class="control-hint">JPG, PNG, WebP or other browser-supported image files. Nothing leaves this device.</p>
        </div>

        <div class="control-group">
          <label for="watermarkSelect">Watermark</label>
          <select id="watermarkSelect">
            <option value="large">jonasnettel.svg</option>
            <option value="small">jonasnettel_small.svg</option>
          </select>
        </div>

        <div class="control-group">
          <label for="colorInput">Watermark color</label>
          <div class="color-control">
            <input id="colorInput" type="color" value="#111111">
            <output id="colorValue" for="colorInput">#111111</output>
          </div>
        </div>

        <div class="control-group">
          <label for="sizeInput">Watermark size <output id="sizeValue" for="sizeInput">18%</output></label>
          <input id="sizeInput" type="range" min="6" max="35" value="18">
          <p class="control-hint">Width relative to the image width. The 3% edge margin is fixed.</p>
        </div>

        <div class="action-row">
          <button class="primary-button" id="downloadCurrent" type="button" disabled>Download image</button>
          <button class="secondary-button" id="downloadAll" type="button" disabled>Download all</button>
        </div>
        <p class="status-message" id="statusMessage" role="status" aria-live="polite">Add one or more photos to begin.</p>
      </aside>

      <section class="preview-panel" aria-label="Photo preview">
        <div class="preview-empty" id="previewEmpty">
          <img src="../assets/logos/jonasnettel_small.svg" alt="">
          <p>YOUR WATERMARKED IMAGE WILL APPEAR HERE</p>
        </div>
        <div class="preview-stage" id="previewStage" hidden>
          <canvas id="previewCanvas"></canvas>
          <div class="preview-label" id="previewLabel"></div>
        </div>
        <div class="photo-strip" id="photoStrip" aria-label="Uploaded photos"></div>
      </section>
    </section>
  </main>

  <script src="./watermark.js"></script>
</body>
</html>
